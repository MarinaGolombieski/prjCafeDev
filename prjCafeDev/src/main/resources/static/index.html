<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafeteria Dev</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>


<h1>Cafeteria Dev</h1>


<div id="registro">
    <h2>Cadastro de Cliente</h2>

    <form id="registroForm">
        <label for="name">Nome:</label>
        <input type="text" id="name" name="name" required>
        <br>
		
		<label for="email">Email:</label>
				 <input type="text" id="email" name="email" required>
		 <br>	 
        <br><br>
        <button type="submit">Cadastrar</button>
    </form>	
</div>


<div id="cadastroPedido">
    <h2>Cadastro de Pedidos</h2>

   			 <form id="formPedido">
			<label for="description">Descrição:</label>
			        <input type="text" id="description" name="description" required>
			 <br>
	        <label for="price">Valor Total:</label>
	        <input type="number" id="price" name="price" step="0.01" required>
	        <br>
			<label for="category">Categoria:</label>
			<input type="text" id="category" name="category" step="0.01" required>
			<br>
	        <label for="date">Data do Pedido:</label>
	        <input type="date" id="date" name="date" required>
	        <br>
			<label for="clienteId">Id do cliente:</label>
			<input type="number" id="clienteId" name="clienteId" required>
			<br>
			
			<button1 type="submit" onclick="cadastrarPedido()">Cadastrar Pedido</button1>
			
		</form>
			</div>
			
			
<div>
	    <h4>Lista de Pedidos</h4>
	    <button4 type="submit" onclick="listarPedidos()">Listar </button4>
	    <ul id="listaPedidos"></ul>
	</div>



<div id="pesquisa">
    <h2>Busca de Cliente por nome</h2>

    <form id="pesquisaForm">

        <label for="searchName">Nome do Cliente:</label>
        <input type="text" id="searchName" name="searchName">

        <br><br>

        <button type="button" onclick="pesquisarCliente()">Pesquisar</button>

    </form>

    <div id="resultadoPesquisa"></div>

</div>

<script src="script.js"></script>

</body>
</html>
