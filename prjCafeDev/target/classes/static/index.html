<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafeteria Dev</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>


<h1>Cafeteria Dev</h1>

<div id="registro">

    <h2>Registro de Pedidos</h2>

    <form id="registroForm">

        <label for="name">Nome:</label>
        <input type="text" id="name" name="name" required>
        <br>
		
		<label for="email">Email:</label>
				 <input type="text" id="email" name="email" required>
		 <br>
				 
		<label for="description">Descrição:</label>
		        <input type="text" id="description" name="description" required>
		 <br>

        
        <label for="price">Valor Total:</label>
        <input type="number" id="price" name="price" step="0.01" required>
        <br>
		
		<label for="category">Categoria:</label>
		<input type="text" id="category" name="category" step="0.01" required>
		<br>

        <label for="date">Data do Pedido:</label>
        <input type="date" id="date" name="date" required>
        <br>
		
		
        <br><br>

        <button type="submit">Cadastrar</button>

    </form>

</div>


<div id="pesquisa">

    <h2>Pesquisa de Pedido</h2>

    <form id="pesquisaForm">

        <label for="searchId">ID do Pedido:</label>
        <input type="number" id="searchId" name="searchId">

        <br><br>

        <button type="button" onclick="pesquisarPedido()">Pesquisar</button>
        <button type="button" onclick="excluirPedido()">Excluir</button>

    </form>

    <div id="resultadoPedido"></div>

</div>

<script src="script.js"></script>

</body>
</html>
